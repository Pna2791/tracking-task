name: Build & Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Never run two deploys at once; a newer push waits for the current deploy to finish
# (not cancelled mid-deploy, so rollback state on the server stays consistent).
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Immutable tag for this commit — images are pinned by tag, never deployed as `latest`.
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  checks:
    name: Lint & smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Smoke-load backend entrypoints
        working-directory: backend
        run: |
          node --check src/index.js
          node --check src/db.js
          node --check src/routes/tasks.js
          node --check src/routes/assignees.js

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  build:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: checks
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHCR requires a lowercase repository path; github.repository may contain uppercase.
      - name: Compute image name
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ env.IMAGE_TAG }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # Only the two files production needs — the deploy job never checks out source.
      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-files
          path: |
            docker-compose.prod.yml
            deploy.sh
          if-no-files-found: error
          retention-days: 7

  # Runs on the self-hosted runner installed on the production machine (MacBook Air M1
  # on a private LAN — no inbound SSH needed; the runner polls GitHub outbound).
  # This job only pulls prebuilt GHCR images and restarts the stack — it never builds.
  deploy:
    name: Deploy on production runner
    runs-on: [self-hosted, production, arm64]
    needs: build
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-files

      # The workflow-scoped GITHUB_TOKEN can pull images that this workflow pushed
      # (packages are linked to the repo). login-action logs out again in its post step,
      # so no registry credentials linger on the production machine.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy (pull image, restart, health check, rollback on failure)
        env:
          # Optional repository Variable; defaults to ~/na-3d-prod/tracking-task
          # on the production machine.
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        # macOS ships bash 3.2 — avoid bash-4 features like ${VAR,,} here.
        run: |
          set -euo pipefail
          DEPLOY_PATH="${DEPLOY_PATH:-$HOME/na-3d-prod/tracking-task}"
          REPO_LC="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"

          mkdir -p "$DEPLOY_PATH"
          # Only the compose file and deploy script are synced — never .env.
          cp docker-compose.prod.yml deploy.sh "$DEPLOY_PATH/"
          chmod +x "$DEPLOY_PATH/deploy.sh"

          cd "$DEPLOY_PATH"
          TASK_IMAGE_REPO="ghcr.io/${REPO_LC}" \
          IMAGE_TAG="$IMAGE_TAG" \
          bash deploy.sh
