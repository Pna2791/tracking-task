<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in — Mind Map Tasks</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #eef2f7;
        --card: #ffffff;
        --ink: #1f2937;
        --muted: #6b7280;
        --accent: #2563eb;
        --accent-hover: #1d4ed8;
        --danger: #b91c1c;
        --border: #e5e7eb;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background:
          radial-gradient(1200px 600px at 10% -10%, #dbeafe 0%, transparent 55%),
          radial-gradient(900px 500px at 100% 0%, #e0e7ff 0%, transparent 50%),
          var(--bg);
        color: var(--ink);
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }
      .card {
        width: 100%;
        max-width: 380px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 1.75rem;
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
      }
      h1 {
        margin: 0 0 0.35rem;
        font-size: 1.35rem;
      }
      p {
        margin: 0 0 1.25rem;
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.45;
      }
      label {
        display: block;
        font-size: 0.85rem;
        font-weight: 600;
        margin-bottom: 0.4rem;
      }
      input[type='password'] {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 0.7rem 0.85rem;
        font-size: 1rem;
        outline: none;
      }
      input[type='password']:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
      }
      button {
        margin-top: 1rem;
        width: 100%;
        border: 0;
        border-radius: 10px;
        background: var(--accent);
        color: white;
        font-weight: 600;
        font-size: 0.95rem;
        padding: 0.75rem 1rem;
        cursor: pointer;
      }
      button:hover {
        background: var(--accent-hover);
      }
      button:disabled {
        opacity: 0.7;
        cursor: wait;
      }
      .error {
        display: none;
        margin-top: 0.85rem;
        color: var(--danger);
        font-size: 0.875rem;
      }
      .error.show {
        display: block;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Mind Map Tasks</h1>
      <p>Enter the access password to continue.</p>
      <form id="login-form" autocomplete="current-password">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required autofocus />
        <button type="submit">Sign in</button>
        <div id="error" class="error" role="alert"></div>
      </form>
    </main>
    <script>
      const form = document.getElementById('login-form');
      const errorEl = document.getElementById('error');
      const params = new URLSearchParams(location.search);
      const next = params.get('next') || '/';

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        errorEl.classList.remove('show');
        errorEl.textContent = '';
        const button = form.querySelector('button');
        button.disabled = true;
        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: document.getElementById('password').value }),
          });
          const body = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(body.error || 'Incorrect password');
          location.replace(next.startsWith('/') ? next : '/');
        } catch (err) {
          errorEl.textContent = err.message || 'Login failed';
          errorEl.classList.add('show');
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
